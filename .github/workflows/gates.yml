# Shared quality gates. Every project calls this file from its own .github/workflows/quality.yml.
# Four jobs, all must be green: the project's own check, secrets, weak libraries, code holes.
name: gates
on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Project check (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; fi
          if [ -f requirements.txt ]; then pip install -q -r requirements.txt; fi
          for r in */requirements.txt; do [ -f "$r" ] && pip install -q -r "$r"; done; true
      - name: scripts/check, or build + test
        env:
          CI: 'true'
        run: |
          if [ -f scripts/check ]; then bash scripts/check
          elif [ -f package.json ]; then npm run build --if-present && npm test --if-present
          else echo "No scripts/check and no package.json: nothing to build or test"; fi

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }   # the whole history: a key deleted later is still leaked
      - name: gitleaks 8.21.2
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner -v .

  libraries:
    name: Weak libraries (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: osv-scanner 1.9.1
        run: |
          curl -sSL -o osv https://github.com/google/osv-scanner/releases/download/v1.9.1/osv-scanner_linux_amd64 && chmod +x osv
          set +e; ./osv --recursive --format json . > osv.json; code=$?; set -e
          if [ $code -eq 128 ]; then echo "No package files to scan"; exit 0; fi   # 128 = nothing to scan
          # Fail on holes in code that ships to users; holes in dev-only tools (tests, build) are warnings.
          python3 - <<'PY'
          import json, sys
          bad = warn = 0
          for r in json.load(open('osv.json')).get('results', []):
              for p in r['packages']:
                  dev = 'dev' in p.get('dependency_groups', [])
                  top = max((float(g.get('max_severity') or 0) for g in p['groups']), default=0)
                  line = f"{p['package']['name']}@{p['package']['version']} ({r['source']['path']}) worst {top}"
                  print(('WARN dev-only ' if dev else 'FAIL ') + line)
                  warn += dev; bad += not dev
          print(f'{bad} shipped package(s) with known holes, {warn} dev-only')
          sys.exit(1 if bad else 0)
          PY

  code:
    name: Code holes (Semgrep, OWASP Top 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: semgrep 1.95.0 (official image, pinned)
        run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.95.0 semgrep scan --config p/owasp-top-ten --severity ERROR --error --metrics off .
